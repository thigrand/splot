<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Splot</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icons/splot.svg" alt="">
        <h1>Splot</h1>
      </header>
      <form id="form" novalidate>
        <label class="sr-only" for="description">Opis</label>
        <textarea id="description" maxlength="4000" rows="3" placeholder="Dodaj opis (opcjonalnie)"></textarea>

        <label class="sr-only" for="tags">Tagi po przecinku</label>
        <input id="tags" type="text" maxlength="1829" autocomplete="off" placeholder="Tagi, po przecinku">

        <div class="choices" role="radiogroup" aria-label="Ważność materiału">
          <label class="choice"><input type="radio" name="importance" value="important" checked><span>Ważne</span></label>
          <label class="choice"><input type="radio" name="importance" value="less_important"><span>Mniej ważne</span></label>
        </div>

        <div class="choices intent-choices" role="radiogroup" aria-label="Intencja dla materiału">
          <label class="choice"><input type="radio" name="intent" value="remember" checked><span>Zapamiętaj</span></label>
          <label class="choice"><input type="radio" name="intent" value="summarize"><span>Podsumuj</span></label>
          <label class="choice"><input type="radio" name="intent" value="research"><span>Research</span></label>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
        <button id="save" type="submit">Zapisz i zamknij kartę</button>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
